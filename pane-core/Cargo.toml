[package]
name = "pane-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2"
aya = { version = "0.13.1", features = ["tokio"] }
once_cell = "1.21.4"

[dev-dependencies]
tokio-test = "0.4"

