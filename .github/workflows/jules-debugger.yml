name: Jules Scheduled Debugger

on:
  schedule:
    # Runs at 02:00 UTC every Monday. Adjust the cron string as needed.
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  run-jules-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Required to create an issue with the report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests # Add any specific LLM SDKs here (e.g., openai, google-generativeai)

      - name: Run Jules Analysis
        env:
          # You must add this secret in your GitHub repository settings
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} 
        run: python .github/scripts/jules_scan.py > jules_report.md

      - name: Create GitHub Issue from Report
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🤖 Jules Scheduled Debug Report"
          content-filepath: jules_report.md
          labels: automated-review, bug
